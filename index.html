<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Longaniza Studio
    </title>

    <link rel="stylesheet" href="css/estilo.css">

</head>


<body>


<div class="app">


    <!-- CABECERA PRINCIPAL -->

    <header id="header" class="header">

        <h1>
            🎬 Longaniza Studio
        </h1>

        <p>
            Entre la risa y la longaniza
        </p>

    </header>



    <!-- MENU LATERAL -->

   <aside id="menu" class="menu">

        <button id="btnProyectos">
📁 Proyectos
</button>


        <button id="btnPersonajes">
            🎭 Personajes
        </button>


        <button id="btnHistorias">
            📝 Historias
        </button>


        <button id="btnEscenarios">
            🏠 Escenarios
        </button>


        <button id="btnEpisodios">
            🎞 Episodios
        </button>


        <button id="btnAudio">
            🎙 Audio
        </button>


        <button id="btnConfiguracion">
            ⚙ Configuración
        </button>


    </aside>




    <!-- AREA DE TRABAJO -->

    <main id="workspace" class="contenido">


        <section id="contenido" class="inicio">


            <h2>
                Bienvenido a Longaniza Studio
            </h2>


            <p>
                Centro de producción de series animadas.
            </p>


            <p>
                Aquí comenzará la creación de personajes,
                historias y episodios.
            </p>


        </section>


<section id="toolbar">

</section>

    </main>



</div>


<footer id="statusbar">

    <span id="statusProyecto">
        Ninguno
    </span>

    <span id="statusModulo">
        Inicio
    </span>

    <span id="statusEstado">
        Listo
    </span>

</footer>



<script src="js/app.js"></script>


</body>

</html>
